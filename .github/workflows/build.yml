          cat > app/src/main/java/com/bridgeville/tvhome/MainActivity.kt <<'TVHOME_EOF'
          package com.bridgeville.tvhome

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import androidx.recyclerview.widget.SimpleItemAnimator
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private lateinit var prefs: Prefs
              private lateinit var adapter: AppAdapter
              private lateinit var rv: RecyclerView
              private lateinit var root: FrameLayout
              private lateinit var tvTemp: TextView
              private lateinit var tvDesc: TextView
              private lateinit var forecast: LinearLayout
              private lateinit var clock: TextClock
              private lateinit var date: TextClock
              private lateinit var hint: TextView

              private val io = Executors.newSingleThreadExecutor()
              private val ui = Handler(Looper.getMainLooper())
              private var allApps: Map<String, AppItem> = emptyMap()
              private var lastWx = 0L

              private val dlgTheme = android.R.style.Theme_DeviceDefault_Dialog_Alert
              private val sizes = intArrayOf(170, 220, 280)
              private val sizeNames = arrayOf("Small", "Medium", "Large")
              private val bgNames = arrayOf("Midnight", "Aurora", "Sunset", "Graphite", "Black")

              private val reload = Runnable { loadApps(false) }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      ui.removeCallbacks(reload)
                      ui.postDelayed(reload, 800)
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // ---------------------------------------------------------------- lifecycle

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  buildUi()
                  applyBackground()
                  applyClock()
                  applyLayoutPrefs()
                  showCachedWeather()
                  loadApps(true)
                  refreshWeather(true)
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_PACKAGE_ADDED)
                  f.addAction(Intent.ACTION_PACKAGE_REMOVED)
                  f.addAction(Intent.ACTION_PACKAGE_REPLACED)
                  f.addDataScheme("package")
                  registerReceiver(pkgReceiver, f)
              }

              override fun onResume() {
                  super.onResume()
                  refreshWeather(false)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent?.hasCategory(Intent.CATEGORY_HOME) == true) {
                      if (adapter.movingPkg != null) endMove()
                      focusAt(0)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(pkgReceiver) } catch (e: Exception) { }
              }

              // ---------------------------------------------------------------- UI

              private fun light(v: TextView) { v.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL) }

              private fun buildUi() {
                  root = FrameLayout(this)
                  root.clipChildren = false

                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.clipChildren = false
                  content.setPadding(dp(56), dp(36), dp(56), dp(16))

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL

                  val left = LinearLayout(this)
                  left.orientation = LinearLayout.VERTICAL
                  tvTemp = TextView(this)
                  tvTemp.setTextColor(Color.WHITE)
                  tvTemp.textSize = 54f
                  tvTemp.text = "…"
                  light(tvTemp)
                  tvDesc = TextView(this)
                  tvDesc.setTextColor(0xCCFFFFFF.toInt())
                  tvDesc.textSize = 18f
                  forecast = LinearLayout(this)
                  forecast.orientation = LinearLayout.HORIZONTAL
                  forecast.setPadding(0, dp(14), 0, 0)
                  left.addView(tvTemp)
                  left.addView(tvDesc)
                  left.addView(forecast)

                  val right = LinearLayout(this)
                  right.orientation = LinearLayout.VERTICAL
                  right.gravity = Gravity.END
                  clock = TextClock(this)
                  clock.textSize = 64f
                  clock.setTextColor(Color.WHITE)
                  light(clock)
                  date = TextClock(this)
                  date.textSize = 20f
                  date.setTextColor(0xCCFFFFFF.toInt())
                  date.format12Hour = "EEEE, MMMM d"
                  date.format24Hour = "EEEE, MMMM d"
                  date.gravity = Gravity.END
                  right.addView(clock)
                  right.addView(date)

                  header.addView(left, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  header.addView(right, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  content.addView(header, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  content.addView(View(this), LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  adapter = AppAdapter(this)
                  rv = RecyclerView(this)
                  rv.adapter = adapter
                  rv.clipToPadding = false
                  rv.clipChildren = false
                  rv.overScrollMode = View.OVER_SCROLL_NEVER
                  rv.setPadding(dp(44), dp(24), dp(44), dp(20))
                  (rv.itemAnimator as? SimpleItemAnimator)?.supportsChangeAnimations = false
                  content.addView(rv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  hint = TextView(this)
                  hint.setTextColor(0xFFFFC107.toInt())
                  hint.textSize = 16f
                  hint.gravity = Gravity.CENTER
                  hint.visibility = View.GONE
                  content.addView(hint, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  root.addView(content, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  setContentView(root)
              }

              private fun applyBackground() {
                  val c = when (prefs.bg) {
                      0 -> intArrayOf(0xFF0B1220.toInt(), 0xFF1B2A49.toInt())
                      1 -> intArrayOf(0xFF0A1F1C.toInt(), 0xFF0F4C5C.toInt(), 0xFF3B2667.toInt())
                      2 -> intArrayOf(0xFF1F1135.toInt(), 0xFF8A2E5C.toInt(), 0xFFE0703F.toInt())
                      3 -> intArrayOf(0xFF101114.toInt(), 0xFF2A2D34.toInt())
                      else -> intArrayOf(0xFF000000.toInt(), 0xFF000000.toInt())
                  }
                  root.background = GradientDrawable(GradientDrawable.Orientation.TL_BR, c)
              }

              private fun applyClock() {
                  val f = if (prefs.clock24) "HH:mm" else "h:mm a"
                  clock.format12Hour = f
                  clock.format24Hour = f
              }

              private fun applyLayoutPrefs() {
                  adapter.tileW = sizes[prefs.tileSize.coerceIn(0, 2)]
                  rv.layoutManager = GridLayoutManager(this, prefs.rows.coerceIn(1, 2), GridLayoutManager.HORIZONTAL, false)
                  adapter.notifyDataSetChanged()
              }

              fun labelFor(item: AppItem): String =
                  if (item.special) "Customize" else (prefs.label(item.pkg) ?: item.defLabel)

              // ---------------------------------------------------------------- apps

              private fun loadApps(initial: Boolean) {
                  io.execute {
                      val pm = packageManager
                      val seen = LinkedHashMap<String, AppItem>()
                      for (cat in arrayOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)) {
                          val q = Intent(Intent.ACTION_MAIN).addCategory(cat)
                          for (ri in pm.queryIntentActivities(q, 0)) {
                              val p = ri.activityInfo.packageName
                              if (p == packageName || seen.containsKey(p)) continue
                              var banner: Drawable? = null
                              try { banner = ri.activityInfo.loadBanner(pm) } catch (e: Exception) { }
                              val art = banner ?: ri.loadIcon(pm)
                              seen[p] = AppItem(p, ri.loadLabel(pm).toString(), art, banner == null)
                          }
                      }
                      ui.post {
                          allApps = seen
                          rebuildList(if (initial) 0 else -1)
                      }
                  }
              }

              private fun rebuildList(focus: Int) {
                  val hidden = prefs.hidden
                  val saved = prefs.order
                  val vis = allApps.filterKeys { it !in hidden }
                  val ordered = saved.mapNotNull { vis[it] } +
                      vis.values.filter { it.pkg !in saved }.sortedBy { it.defLabel.lowercase() }
                  val list = ordered.toMutableList()
                  list.add(AppItem("__settings", "Customize", null, false, true))
                  adapter.items = list
                  adapter.notifyDataSetChanged()
                  if (focus >= 0) rv.postDelayed({ focusAt(focus) }, 80)
              }

              private fun focusAt(pos: Int) {
                  val p = pos.coerceIn(0, maxOf(0, adapter.items.size - 1))
                  rv.scrollToPosition(p)
                  rv.post { (rv.findViewHolderForAdapterPosition(p) as? AppAdapter.VH)?.card?.requestFocus() }
              }

              fun onTileClick(item: AppItem) {
                  if (item.special) { showSettings(); return }
                  val pm = packageManager
                  val i = pm.getLeanbackLaunchIntentForPackage(item.pkg) ?: pm.getLaunchIntentForPackage(item.pkg)
                  if (i == null) {
                      Toast.makeText(this, "Can't open that app", Toast.LENGTH_SHORT).show()
                      return
                  }
                  try { startActivity(i) } catch (e: Exception) {
                      Toast.makeText(this, "Can't open that app", Toast.LENGTH_SHORT).show()
                  }
              }

              fun onTileLong(item: AppItem) {
                  if (item.special) return
                  val opts = arrayOf("Move", "Rename", "Hide", "App info")
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle(labelFor(item))
                      .setItems(opts) { _, w ->
                          when (w) {
                              0 -> startMove(item)
                              1 -> askRename(item)
                              2 -> {
                                  val pos = adapter.items.indexOfFirst { it.pkg == item.pkg }
                                  prefs.hidden = prefs.hidden + item.pkg
                                  rebuildList(pos)
                                  Toast.makeText(this, "Hidden. Restore it in Customize.", Toast.LENGTH_LONG).show()
                              }
                              3 -> try {
                                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + item.pkg)))
                              } catch (e: Exception) { }
                          }
                      }
                      .show()
              }

              private fun askRename(item: AppItem) {
                  val input = EditText(this)
                  input.setSingleLine(true)
                  input.setText(labelFor(item))
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Rename")
                      .setView(input)
                      .setPositiveButton("Save") { _, _ ->
                          prefs.setLabel(item.pkg, input.text.toString())
                          adapter.notifyDataSetChanged()
                      }
                      .setNeutralButton("Reset") { _, _ ->
                          prefs.setLabel(item.pkg, null)
                          adapter.notifyDataSetChanged()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              // ---------------------------------------------------------------- moving

              private fun startMove(item: AppItem) {
                  adapter.movingPkg = item.pkg
                  hint.text = "Use the arrow keys to move this app  ·  press OK to drop"
                  hint.visibility = View.VISIBLE
                  val p = adapter.items.indexOfFirst { it.pkg == item.pkg }
                  if (p >= 0) { adapter.notifyItemChanged(p); refocus(p) }
              }

              private fun moveBy(delta: Int) {
                  val mp = adapter.movingPkg ?: return
                  val cur = adapter.items.indexOfFirst { it.pkg == mp }
                  if (cur < 0) return
                  val last = adapter.items.size - 2 // keep Customize tile last
                  val target = (cur + delta).coerceIn(0, maxOf(0, last))
                  if (target == cur) return
                  val it = adapter.items.removeAt(cur)
                  adapter.items.add(target, it)
                  adapter.notifyItemMoved(cur, target)
                  rv.scrollToPosition(target)
                  refocus(target)
              }

              private fun endMove() {
                  val mp = adapter.movingPkg ?: return
                  val p = adapter.items.indexOfFirst { it.pkg == mp }
                  adapter.movingPkg = null
                  hint.visibility = View.GONE
                  val vis = adapter.items.filter { !it.special }.map { it.pkg }
                  prefs.order = vis + prefs.order.filter { it !in vis }
                  if (p >= 0) { adapter.notifyItemChanged(p); refocus(p) }
              }

              private fun refocus(pos: Int) {
                  rv.post { (rv.findViewHolderForAdapterPosition(pos) as? AppAdapter.VH)?.card?.requestFocus() }
              }

              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  val k = e.keyCode
                  if (adapter.movingPkg != null) {
                      val ours = k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT ||
                          k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_DPAD_DOWN ||
                          k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER ||
                          k == KeyEvent.KEYCODE_BACK
                      if (ours) {
                          if (e.action == KeyEvent.ACTION_DOWN) {
                              val rows = prefs.rows
                              when (k) {
                                  KeyEvent.KEYCODE_DPAD_LEFT -> moveBy(-rows)
                                  KeyEvent.KEYCODE_DPAD_RIGHT -> moveBy(rows)
                                  KeyEvent.KEYCODE_DPAD_UP -> if (rows > 1) moveBy(-1)
                                  KeyEvent.KEYCODE_DPAD_DOWN -> if (rows > 1) moveBy(1)
                                  else -> endMove()
                              }
                          }
                          return true
                      }
                  }
                  if (k == KeyEvent.KEYCODE_BACK) return true // this is the home screen
                  if (k == KeyEvent.KEYCODE_MENU) {
                      if (e.action == KeyEvent.ACTION_UP) showSettings()
                      return true
                  }
                  return super.dispatchKeyEvent(e)
              }

              // ---------------------------------------------------------------- settings

              private fun showSettings() {
                  val items = arrayOf(
                      "Weather location: " + prefs.city,
                      "Temperature: " + (if (prefs.fahrenheit) "°F" else "°C"),
                      "Tile size: " + sizeNames[prefs.tileSize.coerceIn(0, 2)],
                      "Rows: " + prefs.rows,
                      "Background: " + bgNames[prefs.bg.coerceIn(0, bgNames.size - 1)],
                      "Clock: " + (if (prefs.clock24) "24-hour" else "12-hour"),
                      "Hidden apps (" + prefs.hidden.count { allApps.containsKey(it) } + ")",
                      "System settings (Wi-Fi, etc.)"
                  )
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Customize")
                      .setItems(items) { _, w ->
                          when (w) {
                              0 -> askCity()
                              1 -> { prefs.fahrenheit = !prefs.fahrenheit; refreshWeather(true); showSettings() }
                              2 -> { prefs.tileSize = (prefs.tileSize + 1) % 3; applyLayoutPrefs(); showSettings() }
                              3 -> { prefs.rows = if (prefs.rows == 1) 2 else 1; applyLayoutPrefs(); showSettings() }
                              4 -> { prefs.bg = (prefs.bg + 1) % bgNames.size; applyBackground(); showSettings() }
                              5 -> { prefs.clock24 = !prefs.clock24; applyClock(); showSettings() }
                              6 -> showHidden()
                              7 -> try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (e: Exception) { }
                          }
                      }
                      .show()
              }

              private fun showHidden() {
                  val hid = allApps.values.filter { it.pkg in prefs.hidden }
                  if (hid.isEmpty()) {
                      Toast.makeText(this, "No hidden apps", Toast.LENGTH_SHORT).show()
                      showSettings()
                      return
                  }
                  val checked = BooleanArray(hid.size) { true }
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Checked = hidden. Uncheck to show.")
                      .setMultiChoiceItems(hid.map { it.defLabel }.toTypedArray(), checked) { _, w, on -> checked[w] = on }
                      .setPositiveButton("Save") { _, _ ->
                          val h = prefs.hidden.toMutableSet()
                          hid.forEachIndexed { i, a -> if (!checked[i]) h.remove(a.pkg) }
                          prefs.hidden = h
                          rebuildList(-1)
                          showSettings()
                      }
                      .setNegativeButton("Cancel") { _, _ -> showSettings() }
                      .show()
              }

              private fun askCity() {
                  val input = EditText(this)
                  input.setSingleLine(true)
                  input.hint = "City name"
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Search city")
                      .setView(input)
                      .setPositiveButton("Search") { _, _ ->
                          val q = input.text.toString().trim()
                          if (q.isEmpty()) showSettings() else searchCity(q)
                      }
                      .setNegativeButton("Cancel") { _, _ -> showSettings() }
                      .show()
              }

              private fun searchCity(q: String) {
                  io.execute {
                      val res = Weather.geocode(q)
                      ui.post {
                          if (res.isEmpty()) {
                              Toast.makeText(this, "No matches (check Wi-Fi?)", Toast.LENGTH_LONG).show()
                              askCity()
                          } else {
                              AlertDialog.Builder(this, dlgTheme)
                                  .setTitle("Pick a location")
                                  .setItems(res.map { it.label }.toTypedArray()) { _, w ->
                                      prefs.city = res[w].label
                                      prefs.lat = res[w].lat
                                      prefs.lon = res[w].lon
                                      refreshWeather(true)
                                      showSettings()
                                  }
                                  .show()
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- weather

              private fun metaNow() = "" + prefs.lat + "," + prefs.lon + "," + prefs.fahrenheit

              private fun showCachedWeather() {
                  val raw = prefs.cache
                  if (raw != null && prefs.cacheMeta == metaNow()) {
                      Weather.parse(raw)?.let { showWeather(it) }
                  }
              }

              private fun refreshWeather(force: Boolean) {
                  if (!force && System.currentTimeMillis() - lastWx < 15 * 60 * 1000) return
                  val lat = prefs.lat
                  val lon = prefs.lon
                  val f = prefs.fahrenheit
                  val meta = metaNow()
                  io.execute {
                      val raw = Weather.fetchRaw(lat, lon, f)
                      val wx = if (raw != null) Weather.parse(raw) else null
                      ui.post {
                          if (wx != null) {
                              prefs.cache = raw
                              prefs.cacheMeta = meta
                              lastWx = System.currentTimeMillis()
                              showWeather(wx)
                          } else if (tvTemp.text.toString() == "…") {
                              tvDesc.text = "Weather unavailable. Check your Wi-Fi."
                          }
                      }
                  }
              }

              private fun showWeather(wx: Weather.Wx) {
                  val d = Weather.describe(wx.code)
                  tvTemp.text = d.first + "  " + wx.temp + "°"
                  tvDesc.text = d.second + "  ·  H " + wx.hi + "°  L " + wx.lo + "°  ·  " + prefs.city
                  forecast.removeAllViews()
                  for (day in wx.days.drop(1)) {
                      val t = TextView(this)
                      t.gravity = Gravity.CENTER
                      t.setTextColor(0xCCFFFFFF.toInt())
                      t.textSize = 15f
                      t.text = day.name + "\n" + Weather.describe(day.code).first + "\n" + day.hi + "° / " + day.lo + "°"
                      t.setPadding(0, 0, dp(28), 0)
                      forecast.addView(t)
                  }
              }
          }
          TVHOME_EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVHome.apk
      - name: Move latest tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Home (latest)
          files: TVHome.apk
