          package com.bridgeville.tvhome

          import android.animation.ObjectAnimator
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.animation.PathInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class AppAdapter(private val act: MainActivity) : RecyclerView.Adapter<AppAdapter.VH>() {
              var items: MutableList<AppItem> = mutableListOf()
              var tileW = 220
              var movingPkg: String? = null
              private val ease = PathInterpolator(0.2f, 0f, 0f, 1f)

              class VH(
                  val root: LinearLayout,
                  val card: FrameLayout,
                  val img: ImageView,
                  val glyph: TextView,
                  val label: TextView,
                  val ring: GradientDrawable
              ) : RecyclerView.ViewHolder(root)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val c = parent.context
                  val d = c.resources.displayMetrics.density
                  val radius = 18 * d
                  val ring = GradientDrawable()
                  ring.setColor(Color.TRANSPARENT)
                  ring.setStroke((3 * d).toInt(), Color.WHITE)
                  ring.cornerRadius = radius
                  ring.setAlpha(0)

                  val card = FrameLayout(c)
                  card.isFocusable = true
                  card.isClickable = true
                  card.isLongClickable = true
                  val bgd = GradientDrawable()
                  bgd.setColor(0xFF23262D.toInt())
                  bgd.cornerRadius = radius
                  card.background = bgd
                  card.foreground = ring
                  card.clipToOutline = true
                  card.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setRoundRect(0, 0, view.width, view.height, radius)
                      }
                  }

                  val img = ImageView(c)
                  card.addView(img, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  val glyph = TextView(c)
                  glyph.text = "⚙️"
                  glyph.textSize = 46f
                  glyph.setTextColor(Color.WHITE)
                  glyph.gravity = Gravity.CENTER
                  glyph.visibility = View.GONE
                  card.addView(glyph, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  val label = TextView(c)
                  label.setTextColor(Color.WHITE)
                  label.textSize = 14f
                  label.gravity = Gravity.CENTER
                  label.maxLines = 1
                  label.ellipsize = TextUtils.TruncateAt.END
                  label.alpha = 0f
                  label.setPadding(0, (16 * d).toInt(), 0, 0)

                  val root = LinearLayout(c)
                  root.orientation = LinearLayout.VERTICAL
                  root.clipChildren = false
                  val lp = RecyclerView.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  lp.setMargins((12 * d).toInt(), (10 * d).toInt(), (12 * d).toInt(), 0)
                  root.layoutParams = lp
                  root.addView(card, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  root.addView(label, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val vh = VH(root, card, img, glyph, label, ring)
                  card.setOnFocusChangeListener { _, has -> applyFocus(vh, has, true) }
                  card.setOnClickListener {
                      val p = vh.bindingAdapterPosition
                      if (p >= 0) act.onTileClick(items[p])
                  }
                  card.setOnLongClickListener {
                      val p = vh.bindingAdapterPosition
                      if (p >= 0) act.onTileLong(items[p])
                      true
                  }
                  return vh
              }

              override fun onBindViewHolder(h: VH, position: Int) {
                  val item = items[position]
                  val d = h.root.resources.displayMetrics.density
                  val w = (tileW * d).toInt()
                  val ht = w * 9 / 16
                  h.card.layoutParams = LinearLayout.LayoutParams(w, ht)
                  h.label.layoutParams = LinearLayout.LayoutParams(w, ViewGroup.LayoutParams.WRAP_CONTENT)
                  h.label.text = act.labelFor(item)
                  if (item.special) {
                      h.img.setImageDrawable(null)
                      h.glyph.visibility = View.VISIBLE
                  } else {
                      h.glyph.visibility = View.GONE
                      h.img.setImageDrawable(item.art)
                      if (item.isIcon) {
                          h.img.scaleType = ImageView.ScaleType.FIT_CENTER
                          val p = (ht * 0.2f).toInt()
                          h.img.setPadding(p, p, p, p)
                      } else {
                          h.img.scaleType = ImageView.ScaleType.CENTER_CROP
                          h.img.setPadding(0, 0, 0, 0)
                      }
                  }
                  applyFocus(h, h.card.hasFocus(), false)
              }

              override fun getItemCount() = items.size

              private fun isMoving(h: VH): Boolean {
                  val p = h.bindingAdapterPosition
                  return p >= 0 && p < items.size && movingPkg != null && items[p].pkg == movingPkg
              }

              private fun applyFocus(h: VH, has: Boolean, animate: Boolean) {
                  val d = h.root.resources.displayMetrics.density
                  val moving = isMoving(h)
                  val s = if (!has) 1f else if (moving) 1.22f else 1.16f
                  val z = if (has) 28 * d else 0f
                  val la = if (has) 1f else 0f
                  val ra = if (has) 255 else 0
                  h.ring.setStroke((3 * d).toInt(), if (moving) 0xFFFFC107.toInt() else Color.WHITE)
                  if (animate) {
                      h.card.animate().scaleX(s).scaleY(s).translationZ(z).setDuration(220).setInterpolator(ease).start()
                      h.label.animate().alpha(la).setDuration(220).start()
                      ObjectAnimator.ofInt(h.ring, "alpha", if (has) 0 else 255, ra).setDuration(200).start()
                  } else {
                      h.card.animate().cancel()
                      h.card.scaleX = s
                      h.card.scaleY = s
                      h.card.translationZ = z
                      h.label.animate().cancel()
                      h.label.alpha = la
                      h.ring.setAlpha(ra)
                  }
                  if (has) {
                      val p = h.bindingAdapterPosition
                      if (p >= 0 && p < items.size) act.onTileFocused(items[p])
                  }
              }
          }
