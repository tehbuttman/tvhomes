              private fun applyClock() {
                  val f = if (prefs.clock24) "HH:mm" else "h:mm"
                  clock.format12Hour = f
                  clock.format24Hour = f
                  ampm.visibility = if (prefs.clock24) View.GONE else View.VISIBLE
