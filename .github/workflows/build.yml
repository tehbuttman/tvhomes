          package com.bridgeville.tvhome

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.PathInterpolator
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import androidx.recyclerview.widget.SimpleItemAnimator
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private lateinit var prefs: Prefs
              private lateinit var adapter: AppAdapter
              private lateinit var rv: RecyclerView
              private lateinit var root: FrameLayout
              private lateinit var content: LinearLayout
              private lateinit var ambA: ImageView
              private lateinit var ambB: ImageView
              private lateinit var tvTemp: TextView
              private lateinit var tvDesc: TextView
              private lateinit var forecast: LinearLayout
              private lateinit var clock: TextClock
              private lateinit var ampm: TextClock
              private lateinit var date: TextClock
              private lateinit var heroTitle: TextView
              private lateinit var heroSub: TextView
              private lateinit var rowLabel: TextView
              private lateinit var hint: TextView

              private val io = Executors.newSingleThreadExecutor()
              private val ui = Handler(Looper.getMainLooper())
              private var allApps: Map<String, AppItem> = emptyMap()
              private var lastUsed: Map<String, Long> = emptyMap()
              private var lastWx = 0L
              private var ambFront = false
              private var heroPkg: String? = null
              private var pendingHero: AppItem? = null

              private val ease = PathInterpolator(0.2f, 0f, 0f, 1f)
              private val dlgTheme = android.R.style.Theme_DeviceDefault_Dialog_Alert
              private val sizes = intArrayOf(170, 220, 280)
              private val sizeNames = arrayOf("Small", "Medium", "Large")
              private val bgNames = arrayOf("Midnight", "Aurora", "Sunset", "Graphite", "Black")

              private val heroRun = Runnable { applyHero() }
              private val reload = Runnable { loadApps(false) }
              private val pkgReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      ui.removeCallbacks(reload)
                      ui.postDelayed(reload, 800)
                  }
              }

              // Keeps the focused card centered and scrolls smoothly.
              private class CenterGrid(ctx: Context, rows: Int) :
                  GridLayoutManager(ctx, rows, GridLayoutManager.HORIZONTAL, false) {

                  private fun center(parent: RecyclerView, child: View, immediate: Boolean): Boolean {
                      val dx = (child.left + child.width / 2) - (parent.width / 2)
                      if (Math.abs(dx) < 2) return false
                      if (immediate) parent.scrollBy(dx, 0)
                      else parent.smoothScrollBy(dx, 0, DecelerateInterpolator(1.6f), 320)
                      return true
                  }

                  override fun requestChildRectangleOnScreen(
                      parent: RecyclerView, child: View, rect: Rect, immediate: Boolean
                  ): Boolean = center(parent, child, immediate)

                  override fun requestChildRectangleOnScreen(
                      parent: RecyclerView, child: View, rect: Rect, immediate: Boolean, focusedChildVisible: Boolean
                  ): Boolean = center(parent, child, immediate)
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // ---------------------------------------------------------------- lifecycle

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  buildUi()
                  applyBackground()
                  applyClock()
                  applyLayoutPrefs()
                  updateRowLabel()
                  showCachedWeather()
                  loadApps(true)
                  refreshWeather(true)
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_PACKAGE_ADDED)
                  f.addAction(Intent.ACTION_PACKAGE_REMOVED)
                  f.addAction(Intent.ACTION_PACKAGE_REPLACED)
                  f.addDataScheme("package")
                  registerReceiver(pkgReceiver, f)

                  content.alpha = 0f
                  content.animate().alpha(1f).setDuration(500).start()
                  rv.translationY = dp(50).toFloat()
                  rv.animate().translationY(0f).setDuration(650).setInterpolator(ease).start()
              }

              override fun onResume() {
                  super.onResume()
                  refreshWeather(false)
                  refreshUsage()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent?.hasCategory(Intent.CATEGORY_HOME) == true) {
                      if (adapter.movingPkg != null) endMove()
                      focusAt(0)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(pkgReceiver) } catch (e: Exception) { }
              }

