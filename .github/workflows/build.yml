              private fun applyLayoutPrefs() {
                  adapter.tileW = sizes[prefs.tileSize.coerceIn(0, 2)]
                  rv.layoutManager = CenterGrid(this, prefs.rows.coerceIn(1, 2))
                  adapter.notifyDataSetChanged()
              }

              private fun updateRowLabel() {
                  rowLabel.text = if (prefs.sortMode == 0) "RECENTLY USED" else "MY APPS"
              }

              fun labelFor(item: AppItem): String =
                  if (item.special) "Customize" else (prefs.label(item.pkg) ?: item.defLabel)

              // ---------------------------------------------------------------- hero + ambient

              fun onTileFocused(item: AppItem) {
                  if (item.pkg == heroPkg) return
                  pendingHero = item
                  ui.removeCallbacks(heroRun)
                  ui.postDelayed(heroRun, 90)
              }

              private fun ago(t: Long): String {
                  val m = (System.currentTimeMillis() - t) / 60000
                  return when {
                      m < 1 -> "just now"
                      m < 60 -> m.toString() + " min ago"
                      m < 1440 -> (m / 60).toString() + " h ago"
                      m < 2880 -> "yesterday"
                      else -> (m / 1440).toString() + " days ago"
                  }
              }

              private fun applyHero() {
                  val item = pendingHero ?: return
                  heroPkg = item.pkg
                  setAmbient(item.ambient)
                  if (item.special) {
                      heroTitle.text = "Customize"
                      heroSub.text = "Weather, layout, theme and more"
                  } else {
                      heroTitle.text = labelFor(item)
                      val lu = lastUsed[item.pkg] ?: 0L
                      heroSub.text = if (lu > 0L) "Opened " + ago(lu) else "Not opened recently"
                  }
                  for (v in arrayOf(heroTitle, heroSub)) {
                      v.alpha = 0f
                      v.translationY = dp(8).toFloat()
                      v.animate().alpha(1f).translationY(0f).setDuration(240).setInterpolator(ease).start()
                  }
              }

              private fun setAmbient(b: Bitmap?) {
                  val show = if (ambFront) ambA else ambB
                  val hide = if (ambFront) ambB else ambA
                  ambFront = !ambFront
                  show.setImageBitmap(b)
                  show.animate().alpha(if (b != null) 0.5f else 0f).setDuration(500).start()
                  hide.animate().alpha(0f).setDuration(500).start()
              }

              private fun darken(c: Int): Int =
                  Color.rgb((Color.red(c) * 0.45f).toInt(), (Color.green(c) * 0.45f).toInt(), (Color.blue(c) * 0.45f).toInt())

              // Tiny bitmap that gets upscaled (smoothly) into a soft colored glow.
              private fun makeAmbient(src: Drawable, isIcon: Boolean): Bitmap? {
                  return try {
                      val d = src.constantState?.newDrawable()?.mutate() ?: src
                      val w = 64
                      val h = 36
                      val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      val c = Canvas(out)
                      if (!isIcon) {
                          d.setBounds(0, 0, w, h)
                          d.draw(c)
                      } else {
                          val s = 24
                          val small = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                          d.setBounds(0, 0, s, s)
                          d.draw(Canvas(small))
                          var r = 0f
                          var g = 0f
                          var b = 0f
                          var tw = 0f
                          val hsv = FloatArray(3)
                          for (y in 0 until s) {
                              for (x in 0 until s) {
                                  val p = small.getPixel(x, y)
                                  val a = Color.alpha(p) / 255f
                                  if (a < 0.3f) continue
                                  Color.colorToHSV(p, hsv)
                                  val wt = a * (0.15f + hsv[1]) * (0.2f + hsv[2])
                                  r += Color.red(p) * wt
                                  g += Color.green(p) * wt
                                  b += Color.blue(p) * wt
                                  tw += wt
                              }
                          }
                          if (tw <= 0f) return null
                          val col = Color.rgb((r / tw).toInt(), (g / tw).toInt(), (b / tw).toInt())
                          val paint = Paint()
                          paint.shader = LinearGradient(0f, 0f, w.toFloat(), h.toFloat(), col, darken(col), Shader.TileMode.CLAMP)
                          c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), paint)
                      }
                      out
                  } catch (e: Exception) {
                      null
                  }
              }

              // ---------------------------------------------------------------- usage / ordering

              private fun hasUsageAccess(): Boolean = try {
                  val ops = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), packageName) ==
                      AppOpsManager.MODE_ALLOWED
              } catch (e: Exception) {
                  false
              }

              private fun computeLastUsed(pkgs: Collection<String>): Map<String, Long> {
                  val m = HashMap<String, Long>()
                  if (hasUsageAccess()) {
                      try {
                          val usm = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                          val now = System.currentTimeMillis()
                          val list = usm.queryUsageStats(UsageStatsManager.INTERVAL_BEST, now - 30L * 24 * 3600 * 1000, now)
                          if (list != null) {
                              for (u in list) {
                                  var t = u.lastTimeUsed
                                  if (Build.VERSION.SDK_INT >= 29 && u.lastTimeVisible > 0L) t = u.lastTimeVisible
                                  if (t > (m[u.packageName] ?: 0L)) m[u.packageName] = t
                              }
                          }
                      } catch (e: Exception) { }
                  }
                  for (p in pkgs) {
                      val l = prefs.lastLaunch(p)
                      if (l > (m[p] ?: 0L)) m[p] = l
                  }
                  return m
              }

              private fun computeOrdered(): List<AppItem> {
                  val hidden = prefs.hidden
                  val vis = allApps.filterKeys { it !in hidden }
                  return if (prefs.sortMode == 0) {
                      vis.values.sortedWith(
                          compareByDescending<AppItem> { lastUsed[it.pkg] ?: 0L }.thenBy { it.defLabel.lowercase() }
                      )
                  } else {
                      val saved = prefs.order
                      saved.mapNotNull { vis[it] } +
                          vis.values.filter { it.pkg !in saved }.sortedBy { it.defLabel.lowercase() }
                  }
              }

              private fun refreshUsage() {
                  if (allApps.isEmpty()) return
                  val keys = allApps.keys.toList()
                  io.execute {
                      val lu = computeLastUsed(keys)
                      ui.post {
                          lastUsed = lu
                          if (prefs.sortMode == 0 && adapter.movingPkg == null) {
                              val cur = adapter.items.filter { !it.special }.map { it.pkg }
                              val nw = computeOrdered().map { it.pkg }
                              if (cur != nw) rebuildList(0)
                          }
                      }
                  }
              }

              private fun seedManualOrder() {
                  val vis = adapter.items.filter { !it.special }.map { it.pkg }
                  prefs.order = vis + prefs.order.filter { it !in vis }
              }

              // ---------------------------------------------------------------- apps

              private fun loadApps(initial: Boolean) {
                  io.execute {
                      val pm = packageManager
                      val seen = LinkedHashMap<String, AppItem>()
                      for (cat in arrayOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)) {
                          val q = Intent(Intent.ACTION_MAIN).addCategory(cat)
                          for (ri in pm.queryIntentActivities(q, 0)) {
                              val p = ri.activityInfo.packageName
                              if (p == packageName || seen.containsKey(p)) continue
                              var banner: Drawable? = null
                              try { banner = ri.activityInfo.loadBanner(pm) } catch (e: Exception) { }
                              val art = banner ?: ri.loadIcon(pm)
                              val amb = makeAmbient(art, banner == null)
                              seen[p] = AppItem(p, ri.loadLabel(pm).toString(), art, banner == null, false, amb)
                          }
                      }
                      val lu = computeLastUsed(seen.keys)
                      ui.post {
                          allApps = seen
                          lastUsed = lu
                          rebuildList(if (initial) 0 else -1)
                      }
                  }
              }

              private fun rebuildList(focus: Int) {
                  val list = computeOrdered().toMutableList()
                  list.add(AppItem("__settings", "Customize", null, false, true))
                  heroPkg = null
                  adapter.items = list
                  adapter.notifyDataSetChanged()
                  if (focus >= 0) rv.postDelayed({ focusAt(focus) }, 80)
              }

              private fun focusAt(pos: Int) {
                  val p = pos.coerceIn(0, maxOf(0, adapter.items.size - 1))
                  rv.scrollToPosition(p)
                  rv.post { (rv.findViewHolderForAdapterPosition(p) as? AppAdapter.VH)?.card?.requestFocus() }
              }

              fun onTileClick(item: AppItem) {
                  if (item.special) { showSettings(); return }
                  val pm = packageManager
                  val i = pm.getLeanbackLaunchIntentForPackage(item.pkg) ?: pm.getLaunchIntentForPackage(item.pkg)
                  if (i == null) {
                      Toast.makeText(this, "Can't open that app", Toast.LENGTH_SHORT).show()
                      return
                  }
                  prefs.setLastLaunch(item.pkg, System.currentTimeMillis())
                  try {
                      startActivity(i)
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Can't open that app", Toast.LENGTH_SHORT).show()
                  }
              }

              fun onTileLong(item: AppItem) {
                  if (item.special) return
                  val opts = arrayOf("Move", "Rename", "Hide", "App info")
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle(labelFor(item))
                      .setItems(opts) { _, w ->
                          when (w) {
                              0 -> startMove(item)
                              1 -> askRename(item)
                              2 -> {
                                  val pos = adapter.items.indexOfFirst { it.pkg == item.pkg }
                                  prefs.hidden = prefs.hidden + item.pkg
                                  rebuildList(pos)
                                  Toast.makeText(this, "Hidden. Restore it in Customize.", Toast.LENGTH_LONG).show()
                              }
                              3 -> try {
                                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + item.pkg)))
                              } catch (e: Exception) { }
                          }
                      }
                      .showStyled()
              }

              private fun askRename(item: AppItem) {
                  val input = EditText(this)
                  input.setSingleLine(true)
                  input.setText(labelFor(item))
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Rename")
                      .setView(input)
                      .setPositiveButton("Save") { _, _ ->
                          prefs.setLabel(item.pkg, input.text.toString())
                          heroPkg = null
                          adapter.notifyDataSetChanged()
                      }
                      .setNeutralButton("Reset") { _, _ ->
                          prefs.setLabel(item.pkg, null)
                          heroPkg = null
                          adapter.notifyDataSetChanged()
                      }
                      .setNegativeButton("Cancel", null)
                      .showStyled()
              }

              private fun AlertDialog.Builder.showStyled(): AlertDialog {
                  val d = create()
                  val bg = GradientDrawable()
                  bg.setColor(0xF0171A21.toInt())
                  bg.cornerRadius = dp(18).toFloat()
                  d.window?.setBackgroundDrawable(bg)
                  d.show()
                  return d
              }

              // ---------------------------------------------------------------- moving

              private fun startMove(item: AppItem) {
                  if (prefs.sortMode == 0) {
                      seedManualOrder()
                      prefs.sortMode = 1
                      updateRowLabel()
                      Toast.makeText(this, "Switched to My order. Change it in Customize.", Toast.LENGTH_LONG).show()
                  }
                  adapter.movingPkg = item.pkg
                  hint.text = "Use the arrow keys to move this app  ·  press OK to drop"
                  hint.visibility = View.VISIBLE
                  val p = adapter.items.indexOfFirst { it.pkg == item.pkg }
                  if (p >= 0) { adapter.notifyItemChanged(p); refocus(p) }
              }

              private fun moveBy(delta: Int) {
                  val mp = adapter.movingPkg ?: return
                  val cur = adapter.items.indexOfFirst { it.pkg == mp }
                  if (cur < 0) return
                  val last = adapter.items.size - 2 // keep Customize tile last
                  val target = (cur + delta).coerceIn(0, maxOf(0, last))
                  if (target == cur) return
                  val it = adapter.items.removeAt(cur)
                  adapter.items.add(target, it)
                  adapter.notifyItemMoved(cur, target)
                  rv.scrollToPosition(target)
                  refocus(target)
              }

              private fun endMove() {
                  val mp = adapter.movingPkg ?: return
                  val p = adapter.items.indexOfFirst { it.pkg == mp }
                  adapter.movingPkg = null
                  hint.visibility = View.GONE
                  seedManualOrder()
                  if (p >= 0) { adapter.notifyItemChanged(p); refocus(p) }
              }

              private fun refocus(pos: Int) {
                  rv.post { (rv.findViewHolderForAdapterPosition(pos) as? AppAdapter.VH)?.card?.requestFocus() }
              }

              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  val k = e.keyCode
                  if (adapter.movingPkg != null) {
                      val ours = k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT ||
                          k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_DPAD_DOWN ||
                          k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER ||
                          k == KeyEvent.KEYCODE_BACK
                      if (ours) {
                          if (e.action == KeyEvent.ACTION_DOWN) {
                              val rows = prefs.rows
                              when (k) {
                                  KeyEvent.KEYCODE_DPAD_LEFT -> moveBy(-rows)
                                  KeyEvent.KEYCODE_DPAD_RIGHT -> moveBy(rows)
                                  KeyEvent.KEYCODE_DPAD_UP -> if (rows > 1) moveBy(-1)
                                  KeyEvent.KEYCODE_DPAD_DOWN -> if (rows > 1) moveBy(1)
                                  else -> endMove()
                              }
                          }
                          return true
                      }
                  }
                  if (k == KeyEvent.KEYCODE_BACK) return true // this is the home screen
                  if (k == KeyEvent.KEYCODE_MENU) {
                      if (e.action == KeyEvent.ACTION_UP) showSettings()
                      return true
                  }
                  return super.dispatchKeyEvent(e)
              }

              // ---------------------------------------------------------------- settings

              private fun showSettings() {
                  val items = arrayOf(
                      "Weather location: " + prefs.city,
                      "Temperature: " + (if (prefs.fahrenheit) "°F" else "°C"),
                      "Sort: " + (if (prefs.sortMode == 0) "Recently used" else "My order"),
                      "Tile size: " + sizeNames[prefs.tileSize.coerceIn(0, 2)],
                      "Rows: " + prefs.rows,
                      "Theme: " + bgNames[prefs.bg.coerceIn(0, bgNames.size - 1)],
                      "Clock: " + (if (prefs.clock24) "24-hour" else "12-hour"),
                      "Usage access: " + (if (hasUsageAccess()) "On" else "Off (tap to enable)"),
                      "Hidden apps (" + prefs.hidden.count { allApps.containsKey(it) } + ")",
                      "System settings (Wi-Fi, etc.)"
                  )
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Customize")
                      .setItems(items) { _, w ->
                          when (w) {
                              0 -> askCity()
                              1 -> { prefs.fahrenheit = !prefs.fahrenheit; refreshWeather(true); showSettings() }
                              2 -> {
                                  if (prefs.sortMode == 0) { seedManualOrder(); prefs.sortMode = 1 } else prefs.sortMode = 0
                                  updateRowLabel()
                                  rebuildList(-1)
                                  showSettings()
                              }
                              3 -> { prefs.tileSize = (prefs.tileSize + 1) % 3; applyLayoutPrefs(); showSettings() }
                              4 -> { prefs.rows = if (prefs.rows == 1) 2 else 1; applyLayoutPrefs(); showSettings() }
                              5 -> { prefs.bg = (prefs.bg + 1) % bgNames.size; applyBackground(); showSettings() }
                              6 -> { prefs.clock24 = !prefs.clock24; applyClock(); showSettings() }
                              7 -> {
                                  if (hasUsageAccess()) {
                                      Toast.makeText(this, "Usage access is already on", Toast.LENGTH_SHORT).show()
                                      showSettings()
                                  } else {
                                      try {
                                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                                      } catch (e: Exception) {
                                          Toast.makeText(
                                              this,
                                              "This TV has no usage-access screen. Apps you open from here are still tracked.",
                                              Toast.LENGTH_LONG
                                          ).show()
                                          showSettings()
                                      }
                                  }
                              }
                              8 -> showHidden()
                              9 -> try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (e: Exception) { }
                          }
                      }
                      .showStyled()
              }

              private fun showHidden() {
                  val hid = allApps.values.filter { it.pkg in prefs.hidden }
                  if (hid.isEmpty()) {
                      Toast.makeText(this, "No hidden apps", Toast.LENGTH_SHORT).show()
                      showSettings()
                      return
                  }
                  val checked = BooleanArray(hid.size) { true }
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Checked = hidden. Uncheck to show.")
                      .setMultiChoiceItems(hid.map { it.defLabel }.toTypedArray(), checked) { _, w, on -> checked[w] = on }
                      .setPositiveButton("Save") { _, _ ->
                          val h = prefs.hidden.toMutableSet()
                          hid.forEachIndexed { i, a -> if (!checked[i]) h.remove(a.pkg) }
                          prefs.hidden = h
                          rebuildList(-1)
                          showSettings()
                      }
                      .setNegativeButton("Cancel") { _, _ -> showSettings() }
                      .showStyled()
              }

              private fun askCity() {
                  val input = EditText(this)
                  input.setSingleLine(true)
                  input.hint = "City name"
                  AlertDialog.Builder(this, dlgTheme)
                      .setTitle("Search city")
                      .setView(input)
                      .setPositiveButton("Search") { _, _ ->
                          val q = input.text.toString().trim()
                          if (q.isEmpty()) showSettings() else searchCity(q)
                      }
                      .setNegativeButton("Cancel") { _, _ -> showSettings() }
                      .showStyled()
              }

              private fun searchCity(q: String) {
                  io.execute {
                      val res = Weather.geocode(q)
                      ui.post {
                          if (res.isEmpty()) {
                              Toast.makeText(this, "No matches (check Wi-Fi?)", Toast.LENGTH_LONG).show()
                              askCity()
                          } else {
                              AlertDialog.Builder(this, dlgTheme)
                                  .setTitle("Pick a location")
                                  .setItems(res.map { it.label }.toTypedArray()) { _, w ->
                                      prefs.city = res[w].label
                                      prefs.lat = res[w].lat
                                      prefs.lon = res[w].lon
                                      refreshWeather(true)
                                      showSettings()
                                  }
                                  .showStyled()
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- weather

              private fun metaNow() = "" + prefs.lat + "," + prefs.lon + "," + prefs.fahrenheit

              private fun showCachedWeather() {
                  val raw = prefs.cache
                  if (raw != null && prefs.cacheMeta == metaNow()) {
                      Weather.parse(raw)?.let { showWeather(it) }
                  }
              }

              private fun refreshWeather(force: Boolean) {
                  if (!force && System.currentTimeMillis() - lastWx < 15 * 60 * 1000) return
                  val lat = prefs.lat
                  val lon = prefs.lon
                  val f = prefs.fahrenheit
                  val meta = metaNow()
                  io.execute {
                      val raw = Weather.fetchRaw(lat, lon, f)
                      val wx = if (raw != null) Weather.parse(raw) else null
                      ui.post {
                          if (wx != null) {
                              prefs.cache = raw
                              prefs.cacheMeta = meta
                              lastWx = System.currentTimeMillis()
                              showWeather(wx)
                          } else if (tvTemp.text.toString() == "…") {
                              tvDesc.text = "Weather unavailable. Check your Wi-Fi."
                          }
                      }
                  }
              }

              private fun showWeather(wx: Weather.Wx) {
                  val d = Weather.describe(wx.code)
                  tvTemp.text = d.first + " " + wx.temp + "°"
                  tvDesc.text = d.second + "  ·  H " + wx.hi + "°  L " + wx.lo + "°  ·  " + prefs.city
                  forecast.removeAllViews()
                  for (day in wx.days.drop(1)) {
                      val col = LinearLayout(this)
                      col.orientation = LinearLayout.VERTICAL
                      col.gravity = Gravity.CENTER_HORIZONTAL
                      col.setPadding(dp(12), 0, dp(12), 0)
                      val n = TextView(this)
                      n.text = day.name
                      n.textSize = 12f
                      n.gravity = Gravity.CENTER
                      n.setTextColor(0xB3FFFFFF.toInt())
                      val e = TextView(this)
                      e.text = Weather.describe(day.code).first
                      e.textSize = 22f
                      e.gravity = Gravity.CENTER
                      val t = TextView(this)
                      t.text = day.hi.toString() + "° " + day.lo + "°"
                      t.textSize = 12f
                      t.gravity = Gravity.CENTER
                      t.setTextColor(Color.WHITE)
                      col.addView(n)
                      col.addView(e)
                      col.addView(t)
                      forecast.addView(col)
                  }
                  forecast.alpha = 0f
                  forecast.animate().alpha(1f).setDuration(400).start()
              }
          }
          TVHOME_EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVHome.apk
      - name: Move latest tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Home (latest)
          files: TVHome.apk
