          package com.bridgeville.tvhome

          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Locale
          import kotlin.math.roundToInt

          object Weather {
              data class Day(val name: String, val code: Int, val hi: Int, val lo: Int)
              data class Wx(val temp: Int, val code: Int, val hi: Int, val lo: Int, val days: List<Day>)
              data class Place(val label: String, val lat: Double, val lon: Double)

              private fun get(u: String): String? = try {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 8000
                  c.readTimeout = 8000
                  c.inputStream.bufferedReader().use { it.readText() }
              } catch (e: Exception) {
                  null
              }

              fun fetchRaw(lat: Double, lon: Double, f: Boolean): String? {
                  val unit = if (f) "fahrenheit" else "celsius"
                  return get(
                      "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon" +
                          "&current=temperature_2m,weather_code" +
                          "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
                          "&temperature_unit=$unit&timezone=auto&forecast_days=5"
                  )
              }

              fun parse(raw: String): Wx? = try {
                  val j = JSONObject(raw)
                  val cur = j.getJSONObject("current")
                  val d = j.getJSONObject("daily")
                  val t = d.getJSONArray("time")
                  val codes = d.getJSONArray("weather_code")
                  val hi = d.getJSONArray("temperature_2m_max")
                  val lo = d.getJSONArray("temperature_2m_min")
                  val inFmt = SimpleDateFormat("yyyy-MM-dd", Locale.US)
                  val outFmt = SimpleDateFormat("EEE", Locale.getDefault())
                  val days = (0 until t.length()).map { i ->
                      Day(
                          outFmt.format(inFmt.parse(t.getString(i))!!),
                          codes.getInt(i),
                          hi.getDouble(i).roundToInt(),
                          lo.getDouble(i).roundToInt()
                      )
                  }
                  Wx(cur.getDouble("temperature_2m").roundToInt(), cur.getInt("weather_code"), days[0].hi, days[0].lo, days)
              } catch (e: Exception) {
                  null
              }

              fun geocode(q: String): List<Place> {
                  val raw = get(
                      "https://geocoding-api.open-meteo.com/v1/search?name=" +
                          URLEncoder.encode(q, "UTF-8") + "&count=6&language=en&format=json"
                  ) ?: return emptyList()
                  return try {
                      val arr = JSONObject(raw).optJSONArray("results") ?: return emptyList()
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          val admin = o.optString("admin1", "")
                          val cc = o.optString("country_code", "")
                          var label = o.getString("name")
                          if (admin.isNotEmpty()) label += ", $admin"
                          if (cc.isNotEmpty() && cc != "US") label += ", $cc"
                          Place(label, o.getDouble("latitude"), o.getDouble("longitude"))
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun describe(code: Int): Pair<String, String> = when (code) {
                  0 -> Pair("☀️", "Clear")
                  1 -> Pair("🌤️", "Mostly clear")
                  2 -> Pair("⛅", "Partly cloudy")
                  3 -> Pair("☁️", "Overcast")
                  45, 48 -> Pair("🌫️", "Fog")
                  51, 53, 55, 56, 57 -> Pair("🌦️", "Drizzle")
                  61, 63, 65, 66, 67 -> Pair("🌧️", "Rain")
                  71, 73, 75, 77 -> Pair("❄️", "Snow")
                  80, 81, 82 -> Pair("🌧️", "Showers")
                  85, 86 -> Pair("🌨️", "Snow showers")
                  95, 96, 99 -> Pair("⛈️", "Thunderstorm")
                  else -> Pair("🌡️", "Weather")
              }
          }
